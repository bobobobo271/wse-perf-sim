[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wse-perf-sim"
version = "0.2.0"
description = "Python WSE performance simulator with superscalar cores and Calendar NoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
decode = ["matplotlib"]

[project.scripts]
wse-perf-sim = "cli:main"
wse-perf-trace = "analysis.perfetto:main"

[tool.setuptools]
py-modules = ["api", "cli", "config", "errors", "records", "simulator", "tiles"]

[tool.setuptools.packages.find]
include = ["models*", "runtime*", "frontend*", "analysis*"]
namespaces = false
